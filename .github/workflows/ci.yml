name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, for the full-pipeline job below (the slow evaluations that
    # reproduce the cited result numbers).
    - cron: "0 3 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the declared floor (pyproject requires-python); 3.13 is
        # what the local dev venv runs, and is where the tau2-bench
        # `audioop` removal bites (see context/TODOS.md) -- worth keeping
        # both green.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify the correct pymdp package resolved
        # known-issues-and-gotchas.md #1: the plain `pymdp` PyPI package is
        # an unrelated toolkit that also imports as `pymdp`, so a wrong
        # resolution here is silent until something AttributeErrors deep in
        # a run.
        run: python -c "from pymdp.legacy import utils; assert hasattr(utils, 'obj_array_zeros')"

      - name: Tests
        run: pytest -q

  pipeline:
    # The fast half of the end-to-end pipeline (engine sanity check, the
    # LangGraph demos incl. the interrupt/resume path, the cost
    # estimator). The slow evaluation stages are excluded via --quick to
    # keep PR feedback quick; they run in the nightly job below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: End-to-end pipeline (quick)
        run: python scripts/run_full_pipeline.py --quick

  full-pipeline:
    # The full pipeline including the 3000-episode evaluations, which are
    # what actually reproduce the numbers docs/stage0.5-kill-test-results.md
    # and docs/stage2-baselines-results.md cite. Scheduled rather than
    # per-PR because it takes minutes, not seconds.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: End-to-end pipeline (full)
        run: python scripts/run_full_pipeline.py
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-results
          path: results/
